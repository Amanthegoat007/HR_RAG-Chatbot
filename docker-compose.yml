# ============================================================================
# FILE: docker-compose.yml
# PURPOSE: Production Docker Compose — H200 GPU optimized for 30 concurrent users.
# HARDWARE: NVIDIA H200 (144GB VRAM) · 32 vCPUs · 125GB RAM
# GPU BUDGET: vLLM ~10GB | RAG Pipeline (embedder+reranker) ~6GB | Free ~128GB
# USAGE:
#   docker compose up -d
#   docker compose up -d --build   (rebuild after code changes)
# ============================================================================

name: hr-rag-chatbot

services:
  # ==========================================================================
  # 1. FRONTEND — Nginx serving React SPA + Reverse Proxy (/api/*)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_started
      rag-pipeline:
        condition: service_started
    networks:
      - hr-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 256M

  # ==========================================================================
  # 2. BACKEND MONOLITH — FastAPI (Auth, BFF, Ingest)
  #    4 Uvicorn workers via supervisord → handles 30 concurrent HTTP connections
  # ==========================================================================
  backend:
    image: hr-rag-chatbot-backend
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-8}
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-hr-documents}
      RAG_PIPELINE_URL: ${RAG_PIPELINE_URL:-http://rag-pipeline:8002}
      DOCUMENT_INGEST_URL: ${DOCUMENT_INGEST_URL:-http://document-ingest-api:8003}
      INGEST_INTERNAL_TOKEN: ${INGEST_INTERNAL_TOKEN}
      LLM_SERVER_URL: ${LLM_SERVER_URL:-http://llm:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-hr_admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      USER_USERNAME: ${USER_USERNAME:-hr_user}
      USER_PASSWORD_HASH: ${USER_PASSWORD_HASH}
      BENCHMARK_USERNAME: ${BENCHMARK_USERNAME:-}
      BENCHMARK_PASSWORD_HASH: ${BENCHMARK_PASSWORD_HASH:-}
      FRONTEND_INTERNAL_URL: ${FRONTEND_INTERNAL_URL:-http://frontend}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-}
      PROMETHEUS_PUBLIC_URL: ${PROMETHEUS_PUBLIC_URL:-}
      BACKEND_WORKERS: ${BACKEND_WORKERS:-2}
    volumes:
      - ./services/backend/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      - ./services/backend/app:/app/app:ro
      - ./shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - hr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 4G

  backend-maintenance-worker:
    image: hr-rag-chatbot-backend
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: backend-maintenance-worker
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-8}
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-hr-documents}
      RAG_PIPELINE_URL: ${RAG_PIPELINE_URL:-http://rag-pipeline:8002}
      DOCUMENT_INGEST_URL: ${DOCUMENT_INGEST_URL:-http://document-ingest-api:8003}
      INGEST_INTERNAL_TOKEN: ${INGEST_INTERNAL_TOKEN}
      LLM_SERVER_URL: ${LLM_SERVER_URL:-http://llm:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-hr_admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      USER_USERNAME: ${USER_USERNAME:-hr_user}
      USER_PASSWORD_HASH: ${USER_PASSWORD_HASH}
      BENCHMARK_USERNAME: ${BENCHMARK_USERNAME:-}
      BENCHMARK_PASSWORD_HASH: ${BENCHMARK_PASSWORD_HASH:-}
      FRONTEND_INTERNAL_URL: ${FRONTEND_INTERNAL_URL:-http://frontend}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-}
      PROMETHEUS_PUBLIC_URL: ${PROMETHEUS_PUBLIC_URL:-}
    volumes:
      - ./services/backend/app:/app/app:ro
      - ./shared:/app/shared:ro
    command: >
      celery -A app.celery_app worker --concurrency=1 --prefetch-multiplier=1 --loglevel=INFO --queues=backend-maintenance
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      document-ingest-api:
        condition: service_started
      llm:
        condition: service_started
    networks:
      - hr-network
    restart: unless-stopped
    healthcheck:
      disable: true

  backend-maintenance-beat:
    image: hr-rag-chatbot-backend
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: backend-maintenance-beat
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-8}
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-hr-documents}
      RAG_PIPELINE_URL: ${RAG_PIPELINE_URL:-http://rag-pipeline:8002}
      DOCUMENT_INGEST_URL: ${DOCUMENT_INGEST_URL:-http://document-ingest-api:8003}
      INGEST_INTERNAL_TOKEN: ${INGEST_INTERNAL_TOKEN}
      LLM_SERVER_URL: ${LLM_SERVER_URL:-http://llm:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-hr_admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      USER_USERNAME: ${USER_USERNAME:-hr_user}
      USER_PASSWORD_HASH: ${USER_PASSWORD_HASH}
      BENCHMARK_USERNAME: ${BENCHMARK_USERNAME:-}
      BENCHMARK_PASSWORD_HASH: ${BENCHMARK_PASSWORD_HASH:-}
      FRONTEND_INTERNAL_URL: ${FRONTEND_INTERNAL_URL:-http://frontend}
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-}
      PROMETHEUS_PUBLIC_URL: ${PROMETHEUS_PUBLIC_URL:-}
    volumes:
      - ./services/backend/app:/app/app:ro
      - ./shared:/app/shared:ro
    command: >
      celery -A app.celery_app beat --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      document-ingest-api:
        condition: service_started
      llm:
        condition: service_started
    networks:
      - hr-network
    restart: unless-stopped
    healthcheck:
      disable: true

  # ==========================================================================
  # 3. DOCUMENT INGEST API — Canonical normalization + queue dispatch
  # ==========================================================================
  document-ingest-api:
    image: hr-rag-chatbot-document-ingest:latest
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    container_name: document-ingest-api
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-hr-documents}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-hr_documents}
      EMBEDDING_SVC_URL: ${EMBEDDING_SVC_URL:-http://rag-pipeline:8002}
      INGEST_INTERNAL_TOKEN: ${INGEST_INTERNAL_TOKEN}
      UNSTRUCTURED_PDF_STRATEGY: ${UNSTRUCTURED_PDF_STRATEGY:-fast}
      PYTHONPATH: /app
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NLTK_DATA: /app/nltk_data
      HF_HOME: /app/docling-models
      HF_HUB_OFFLINE: 1
      INGEST_API_WORKERS: ${INGEST_API_WORKERS:-2}
    volumes:
      - ./services/ingest/app:/app/app:ro
      - ./shared:/app/shared:ro
      - ./services/ingest/nltk_data:/app/nltk_data:ro
      - ./services/ingest/docling-models:/app/docling-models:ro
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8003 --workers ${INGEST_API_WORKERS:-2} --log-level info"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
      rag-pipeline:
        condition: service_started
    networks:
      - hr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  # ==========================================================================
  # 4. DOCUMENT INGEST WORKER — Celery worker for normalization/indexing
  #    concurrency=6 to saturate CPU during batch ingestion
  # ==========================================================================
  document-ingest-worker:
    image: hr-rag-chatbot-document-ingest:latest
    container_name: document-ingest-worker
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-hr-documents}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-hr_documents}
      EMBEDDING_SVC_URL: ${EMBEDDING_SVC_URL:-http://rag-pipeline:8002}
      INGEST_INTERNAL_TOKEN: ${INGEST_INTERNAL_TOKEN}
      UNSTRUCTURED_PDF_STRATEGY: ${UNSTRUCTURED_PDF_STRATEGY:-fast}
      PYTHONPATH: /app
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NLTK_DATA: /app/nltk_data
      HF_HOME: /app/docling-models
      HF_HUB_OFFLINE: 1
      INGEST_WORKER_CONCURRENCY: ${INGEST_WORKER_CONCURRENCY:-2}
    volumes:
      - ./services/ingest/app:/app/app:ro
      - ./shared:/app/shared:ro
      - ./services/ingest/nltk_data:/app/nltk_data:ro
      - ./services/ingest/docling-models:/app/docling-models:ro
    command: >
      sh -c "celery -A app.celery_app worker --concurrency=${INGEST_WORKER_CONCURRENCY:-2} --prefetch-multiplier=1 --loglevel=INFO --queues=document_processing"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
      rag-pipeline:
        condition: service_started
    networks:
      - hr-network
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 12G

  # ==========================================================================
  # 5. RAG PIPELINE — Query Orchestrator + Embedding + Reranker (GPU)
  #    4 Uvicorn workers — each handles embedding/reranking on GPU
  #    GPU VRAM: ~6GB (bge-m3 ~2.4GB + bge-reranker-v2-m3 ~2.2GB + overhead)
  # ==========================================================================
  rag-pipeline:
    build:
      context: ./services/rag-pipeline
      dockerfile: Dockerfile
    container_name: rag-pipeline
    environment:
      JWT_SECRET: ${JWT_SECRET}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-hr_documents}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_SIMILARITY_THRESHOLD: ${CACHE_SIMILARITY_THRESHOLD:-0.88}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      LLM_SERVER_URL: ${LLM_SERVER_URL:-http://llm:8080}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-600}
      LLM_MAX_TOKENS_SHORT: ${LLM_MAX_TOKENS_SHORT:-300}
      LLM_MAX_TOKENS_MEDIUM: ${LLM_MAX_TOKENS_MEDIUM:-400}
      LLM_MAX_TOKENS_LONG: ${LLM_MAX_TOKENS_LONG:-600}
      LLM_MAX_TOKENS_DEEP_SHORT: ${LLM_MAX_TOKENS_DEEP_SHORT:-500}
      LLM_MAX_TOKENS_DEEP_MEDIUM: ${LLM_MAX_TOKENS_DEEP_MEDIUM:-800}
      LLM_MAX_TOKENS_DEEP_LONG: ${LLM_MAX_TOKENS_DEEP_LONG:-1000}
      LLM_MAX_TOKENS_DEEP_CAP: ${LLM_MAX_TOKENS_DEEP_CAP:-1000}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_TOP_P: ${LLM_TOP_P:-0.95}
      LLM_STOP_SEQUENCE: ${LLM_STOP_SEQUENCE:-<END_ANSWER>}
      LLM_ADAPTIVE_TOKENS_ENABLED: ${LLM_ADAPTIVE_TOKENS_ENABLED:-true}
      LLM_DEEP_REASONING_TOKEN_LIMIT_BEFORE_FALLBACK: ${LLM_DEEP_REASONING_TOKEN_LIMIT_BEFORE_FALLBACK:-256}
      LLM_DEEP_FIRST_VISIBLE_TIMEOUT_SECONDS: ${LLM_DEEP_FIRST_VISIBLE_TIMEOUT_SECONDS:-4.0}
      PROMPT_MAX_CHUNKS: ${PROMPT_MAX_CHUNKS:-6}
      PROMPT_MAX_CHUNK_CHARS: ${PROMPT_MAX_CHUNK_CHARS:-800}
      PROMPT_MAX_CHUNK_SENTENCES: ${PROMPT_MAX_CHUNK_SENTENCES:-15}
      TOP_N_RERANK: ${TOP_N_RERANK:-8}
      RETRIEVAL_DENSE_TOP_K: ${RETRIEVAL_DENSE_TOP_K:-30}
      RETRIEVAL_SPARSE_TOP_K: ${RETRIEVAL_SPARSE_TOP_K:-30}
      RETRIEVAL_RERANK_TOP_N: ${RETRIEVAL_RERANK_TOP_N:-40}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-1024}
      DETERMINISTIC_ANSWERS_ENABLED: ${DETERMINISTIC_ANSWERS_ENABLED:-false}
      DETERMINISTIC_CALC_ENABLED: ${DETERMINISTIC_CALC_ENABLED:-false}
      DETERMINISTIC_LIST_ENABLED: ${DETERMINISTIC_LIST_ENABLED:-false}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      HF_HUB_ENABLE_HF_TRANSFER: 0
      MODEL_PREFETCH_ON_STARTUP: ${MODEL_PREFETCH_ON_STARTUP:-true}
      MODEL_DOWNLOAD_WORKERS: ${MODEL_DOWNLOAD_WORKERS:-16}
      RAG_PIPELINE_WORKERS: ${RAG_PIPELINE_WORKERS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HF_HUB_OFFLINE: 0
      # CUDA: ensure models are loaded on GPU
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - ./services/llm/models:/models:ro
      - ./services/rag-pipeline/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      - ./services/rag-pipeline/app:/app/app:ro
      - ./shared:/app/shared:ro
      - hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - hr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # Models take time to load
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 20G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ==========================================================================
  # 5.5 LLM SERVER — vLLM with CUDA (Qwen 3.5 9B native fp16)
  #    GPU VRAM: ~18GB (fp16 9B model + KV cache for 30 concurrent slots)
  #    vLLM PagedAttention gives massive throughput on H200's HBM3e bandwidth
  #    --reasoning-parser qwen3: separates thinking from content at engine level
  # ==========================================================================
  llm:
    image: vllm/vllm-openai:latest
    container_name: llm
    volumes:
      - ./services/llm/models:/models:ro
      - hf_cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command: >
      --model Qwen/Qwen3.5-9B
      --host 0.0.0.0
      --port 8080
      --max-model-len 32768
      --served-model-name local
      --gpu-memory-utilization 0.40
      --trust-remote-code
      --max-num-seqs 32
      --enable-prefix-caching
      --dtype float16
      --mamba-cache-mode align
      --mamba-block-size 8
      --reasoning-parser qwen3
    ports:
      - "8100:8080"
    networks:
      - hr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 32G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ==========================================================================
  # 6. MONITORING — Prometheus + Grafana (Using Supervisor)
  # ==========================================================================
  monitoring:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: monitoring
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000" # Grafana
      - "9090:9090" # Prometheus
    networks:
      - hr-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ==========================================================================
  # 7. POSTGRESQL — Conversations, Messages, Documents, Audit
  #    Tuned for 30 concurrent users with generous connection pool
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=2GB
      -c work_mem=64MB
      -c effective_cache_size=8GB
      -c maintenance_work_mem=512MB
      -c max_connections=300
      -c wal_buffers=64MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - hr-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

  # ==========================================================================
  # 8. REDIS (Valkey) — Semantic cache + Celery broker
  #    allkeys-lru eviction for cache pressure under 30 users
  # ==========================================================================
  redis:
    image: valkey/valkey:7.2-alpine
    container_name: redis
    command: >
      valkey-server --maxmemory 4gb --maxmemory-policy allkeys-lru --save "" --appendonly no --loglevel warning --io-threads 4
    volumes:
      - redis_data:/data
    networks:
      - hr-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 5G

  # ==========================================================================
  # 9. QDRANT — Vector database
  #    in-memory payload + 16 optimizer threads for fast retrieval
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: qdrant
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "false"
      QDRANT__STORAGE__PERFORMANCE__OPTIMIZER_CPU_BUDGET: "16"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - hr-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G

  # ==========================================================================
  # 10. MINIO — Document Store (S3 compatible)
  # ==========================================================================
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - hr-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

networks:
  hr-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  hf_cache:
