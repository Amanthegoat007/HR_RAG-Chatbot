# ============================================================================
# FILE: nginx.conf
# PURPOSE: Nginx reverse proxy — optimised for 30 concurrent employees.
# ============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout 75s;
    keepalive_requests 2000;
    server_tokens off;

    # Gzip — saves bandwidth for markdown-heavy SSE streams
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/event-stream;

    # Rate limiting — 30 users × ~2 req/s burst headroom
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    # Allow large files for document ingestion
    client_max_body_size 200M;
    client_body_buffer_size 10M;
    client_body_timeout 300s;

    # Upstreams with connection keepalive pools (reuse TCP to backend)
    upstream backend_monolith {
        server backend:8000;
        keepalive 32;       # persistent connections to backend
    }

    upstream rag_pipeline {
        server rag-pipeline:8002;
        keepalive 16;
    }

    # Proxy cache for static assets
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=60m;

    server {
        listen 80;
        server_name _;

        # Health check
        location = /health {
            access_log off;
            return 200 '{"status":"healthy","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # STATIC FRONTEND SPA — aggressive caching for assets
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache hashed assets aggressively (Vite generates unique filenames)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # PROXY ALL /api/* requests (Auth, Conversations, Messages, Documents)
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            
            proxy_pass http://backend_monolith/api/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE / streaming — disable all buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            
            # HTTP/1.1 keepalive to upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Streaming uploads
            proxy_request_buffering off;
        }
    }
}
